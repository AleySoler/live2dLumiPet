<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>live2dLumiPet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-drag: none;
        cursor: default;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage canvas {
        display: block;
      }
      #status {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        font: 12px/1.6 "Microsoft YaHei", system-ui, sans-serif;
        color: #e6f0ff;
        background: rgba(10, 16, 32, 0.72);
        border: 1px solid rgba(120, 170, 255, 0.35);
        border-radius: 8px;
        padding: 6px 12px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s;
        max-width: 92vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #hud {
        position: fixed;
        left: 8px;
        top: 8px;
        display: none;
        white-space: pre;
        font: 11px/1.5 Consolas, monospace;
        color: #9fd4ff;
        background: rgba(6, 10, 22, 0.7);
        border-radius: 6px;
        padding: 6px 8px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"></div>
    <div id="status"></div>
    <script type="module" src="./pet/main.ts"></script>
  </body>
</html>
